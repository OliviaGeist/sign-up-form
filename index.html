<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up!</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="titleCard">
        <div class="logoBox">
            <div class="logo">
                <img class="logoImage" src="images/odin-lined.png" alt="Odin logo">
                <h1>ODIN</h1>
            </div>
        </div>
        <p class="attribution">Photo by <a href="https://unsplash.com/photos/green-grass-under-blue-sky-and-white-clouds-during-daytime-64kcDFDgczI">Alessia C_Jpg</a> 
            on <a href="unsplash.com">Unsplash</a>
        </p>
    </div>
    <div class="content">
        <div class="splashBox">
            <p>This is not a real online service! You know you need 
                something like this in your life to help you realize 
                your deepest dreams. Sign up <em>now</em> to get 
                started
            </p>
            <p> You <em>know</em> you want to.</p>
        </div>
        <div class="formBox">
            <form action="">
                <div class="userInputs">
                    <h2>Let's do this!</h2>
                    <fieldset class="nameFields">
                        <div class="inputBlock">
                            <label for="firstName">FIRST NAME</label>
                            <input type="text" id="firstName">
                        </div>
                        <div class="inputBlock">
                            <label for="lastName">LAST NAME</label>
                            <input type="text" id="lastName">
                        </div>
                    </fieldset>
                    <fieldset class="contactFields">
                        <div class="inputBlock">
                            <label for="email">EMAIL</label>
                            <input type="email" id="email">
                        </div>
                        <div class="inputBlock">
                            <label for="phoneNumber">PHONE NUMBER</label>
                            <input type="tel" id="phoneNumber">
                        </div>
                    </fieldset>
                    <fieldset class="passwordFields">
                        <div class="inputBlock">
                            <label for="password">PASSWORD</label>
                            <input type="password" id="password">
                        </div>
                        <div class="inputBlock">
                            <label for="passwordConfirm">CONFIRM PASSWORD</label>
                            <input type="password" id="passwordConfirm">
                        </div>
                    </fieldset>
                </div>
                <button id="createAccount" type="submit">Create Account</button>
            </form>
            <p class="logIn">Already have an account? <a href="index.html">Log in</a></p>
        </div>
    </div>
</body>
</html>
